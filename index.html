<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Sát Hạch CNTT - Phần 2 (Câu 29-57)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #c82333;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-size: 22px;
        }
        .question-block {
            background: #fafafa;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 4px solid #dc3545;
            border-radius: 4px;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-label:hover {
            background: #fff5f5;
            border-color: #dc3545;
        }
        .option-label input {
            margin-right: 12px;
            transform: scale(1.2);
        }
        .btn-submit {
            display: block;
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #218838;
        }
        .result-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #e2f0d9;
            border: 2px solid #385723;
            border-radius: 6px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #385723;
        }
        .correct-answer {
            background: #d4edda !important;
            border-color: #28a745 !important;
            font-weight: bold;
        }
        .wrong-answer {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
        }
    </style>
</head>

<div class="container">

    <div id="quiz"></div>
    <button class="btn-submit" onclick="checkAnswers()">NỘP BÀI & XEM KẾT QUẢ</button>
    <div id="result" class="result-box"></div>
</div>

        correct: 3

];

function loadQuiz() {
    const quizContainer = document.getElementById('quiz');
    let output = '';

    quizData.forEach((item, qIndex) => {
        const questionNumber = qIndex + 29; 
        output += `
            <div class="question-block" id="q-block-${qIndex}">
                <div class="question-text">Câu ${questionNumber}: ${item.q}</div>
                <div class="options">
        `;
        
        item.a.forEach((option, oIndex) => {
            const prefix = String.fromCharCode(97 + oIndex); 
            output += `
                <label class="option-label" id="label-${qIndex}-${oIndex}">
                    <input type="radio" name="question${qIndex}" value="${oIndex}">
                    ${prefix}. ${option}
                </label>
            `;
        });

        output += `
                </div>
            </div>
        `;
    });

    quizContainer.innerHTML = output;
}

function checkAnswers() {
    let score = 0;

    quizData.forEach((item, qIndex) => {
        const selected = document.querySelector(`input[name="question${qIndex}"]:checked`);
        
        item.a.forEach((_, oIndex) => {
            document.getElementById(`label-${qIndex}-${oIndex}`).classList.remove('correct-answer', 'wrong-answer');
        });

        document.getElementById(`label-${qIndex}-${item.correct}`).classList.add('correct-answer');

        if (selected) {
            const answerIndex = parseInt(selected.value);
            if (answerIndex === item.correct) {
                score++;
            } else {
                document.getElementById(`label-${qIndex}-${answerIndex}`).classList.add('wrong-answer');
            }
        }
    });

    const resultBox = document.getElementById('result');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `Kết quả: Đúng ${score}/${quizData.length} câu! Đạt được ${((score/quizData.length)*10).toFixed(2)} điểm.`;
    resultBox.scrollIntoView({ behavior: 'smooth' });
}

loadQuiz();
</script>

</body>
</html>
